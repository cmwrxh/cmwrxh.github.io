name: Homepage visual review

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/legacy-home.css'
      - 'css/homepage-reference-redesign.css'
      - 'js/compliance.js'
      - 'js/main.js'
      - 'js/homepage-reference-redesign.js'
      - 'scripts/homepage-dotfield-test.mjs'\n      - 'scripts/dot-live-test.mjs'
      - 'data/africa-110m.geojson'
      - 'data/NATURAL_EARTH_LICENSE.md'
      - 'docs/visual-review/reference.html'
      - 'scripts/visual-review.mjs'
      - '.github/workflows/homepage-visual-review.yml'

concurrency:
  group: homepage-visual-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Check out main for restored-section baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-reference
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check visual review script syntax
        run: node --check scripts/visual-review.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/homepage-visual-review-server.log 2>&1 &
          echo $! > /tmp/homepage-visual-review-server.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory main-reference >/tmp/homepage-main-baseline.log 2>&1 &
          echo $! > /tmp/homepage-main-baseline.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null && curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/homepage-visual-review-server.log
          exit 1
      - name: Check homepage script syntax
        run: node --check js/homepage-reference-redesign.js
      - name: Test stable DotField parameters, map data, tabs and mobile overflow
        run: node scripts/homepage-dotfield-test.mjs
      - name: Capture viewport and full-page reference comparisons at desktop, tablet, and mobile widths
        run: node scripts/visual-review.mjs
      - name: Run Lighthouse mobile performance audit for homepage
        run: |
          npx --yes lighthouse http://127.0.0.1:4173/ --chrome-flags='--headless --no-sandbox' --only-categories=performance --output=json --output-path=/tmp/home-lighthouse.json --quiet
          cp /tmp/home-lighthouse.json artifacts/visual-review/home-lighthouse.json
          node -e 'const r=require("/tmp/home-lighthouse.json"); const score=Math.round(r.categories.performance.score*100); console.log("Lighthouse mobile performance score: "+score); console.log("Lighthouse form factor: "+r.configSettings.formFactor+"; URL: "+r.finalDisplayedUrl); console.log("Lighthouse opportunities: "+Object.values(r.audits).filter(a=>a.details&&a.details.type==="opportunity"&&a.score!==null&&a.score<0.9).sort((a,b)=>(a.score??1)-(b.score??1)).slice(0,8).map(a=>a.id+":"+a.displayValue).join("; ")); if(score<95)process.exit(1)'
      - name: Upload visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-reference-comparisons
          path: artifacts/visual-review/
          if-no-files-found: error
          retention-days: 14
