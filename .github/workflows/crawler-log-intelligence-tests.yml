name: Crawler log intelligence tests
on:
  pull_request:
    paths:
      - 'api/crawler-log-ingest.js'
      - 'api/crawler-projects.js'
      - 'api/crawler-activity.js'
      - 'lib/crawler-bot-verification.js'
      - 'tests/crawler-bot-verification.test.js'
      - 'package.json'
      - '.github/workflows/crawler-log-intelligence-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/crawler-log-ingest.js'
      - 'api/crawler-projects.js'
      - 'api/crawler-activity.js'
      - 'lib/crawler-bot-verification.js'
      - 'tests/crawler-bot-verification.test.js'
      - 'package.json'
      - '.github/workflows/crawler-log-intelligence-tests.yml'
  workflow_dispatch:
jobs:
  crawler-log-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check api/crawler-log-ingest.js && node --check api/crawler-projects.js && node --check api/crawler-activity.js && node --check lib/crawler-bot-verification.js && node --check js/crawler-activity.js && node --check server.js && node --test tests/crawler-bot-verification.test.js
