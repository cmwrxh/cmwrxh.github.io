name: Auth return-path tests
on:
  pull_request:
  push:
    branches:
      - main
      - feat/auth-form-consistency
jobs:
  auth-next-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:auth-next
