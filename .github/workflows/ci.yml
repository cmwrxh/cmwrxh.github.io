name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint --if-present
      - name: Existing Node test suite
        run: |
          set -e
          for script in $(node -e "const p=require('./package.json'); console.log(Object.keys(p.scripts||{}).filter(k=>k.startsWith('test:')).join(' '))"); do
            npm run "$script"
          done
          if [ -d tests ]; then node --test tests; fi
      - name: JavaScript syntax checks
        run: |
          set -e
          find api -type f -name '*.js' -print0 2>/dev/null | xargs -0 -r -n1 node --check
          node --check server.js
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Vet and test every Go module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find . -name go.mod -not -path './node_modules/*' -not -path './.git/*' -printf '%h\\n' | sort)
          for dir in "${modules[@]}"; do
            echo "::group::Go module $dir"
            (cd "$dir" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done
