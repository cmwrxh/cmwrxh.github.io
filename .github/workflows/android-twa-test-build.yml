name: Android TWA test build

on:
  pull_request:
    paths:
      - ".github/workflows/android-twa-test-build.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-twa-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-artifacts:
    name: Build APK and AAB for testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;36.1.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Check public PWA
        run: node scripts/check-android-pwa.mjs

      - name: Create Bubblewrap project configuration
        shell: bash
        run: |
          mkdir -p android
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            packageId: 'dev.africalatency.app',
            host: 'africalatency.dev',
            name: 'AfricaLatency',
            launcherName: 'AfricaLatency',
            display: 'standalone',
            orientation: 'portrait',
            themeColor: '#0E131A',
            themeColorDark: '#0E131A',
            backgroundColor: '#0E131A',
            navigationColor: '#0E131A',
            startUrl: '/',
            iconUrl: 'https://africalatency.dev/images/web-app-manifest-512x512.png',
            maskableIconUrl: 'https://africalatency.dev/images/web-app-manifest-512x512.png',
            webManifestUrl: 'https://africalatency.dev/manifest.json',
            appVersionCode: 1,
            appVersionName: '1.0.0',
            minSdkVersion: 24,
            enableNotifications: false,
            enableSiteSettingsShortcut: true,
            splashScreenFadeOutDuration: 300,
            fallbackType: 'customtabs',
            generatorApp: 'bubblewrap-cli',
            signingKey: { path: './android.keystore', alias: 'africalatency' },
            fingerprints: [],
            shortcuts: [
              { name: 'Run a free scan', shortName: 'Free scan', url: '/scan', chosenIconUrl: 'https://africalatency.dev/images/web-app-manifest-192x192.png' },
              { name: 'Sign in', shortName: 'Sign in', url: '/login', chosenIconUrl: 'https://africalatency.dev/images/web-app-manifest-192x192.png' }
            ]
          };
          fs.writeFileSync('android/twa-manifest.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Generate temporary test signing key
        id: signing
        shell: bash
        run: |
          STORE_PASS="$(openssl rand -hex 20)"
          echo "::add-mask::$STORE_PASS"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          keytool -genkeypair -v \
            -keystore android/android.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias africalatency \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AfricaLatency Test, OU=Android, O=Brilliant Unicorn, L=Nairobi, ST=Kenya, C=KE"

      - name: Configure and verify Bubblewrap SDK
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Bubblewrap SDK validation checks for a top-level tools/ or bin/ directory.
          # Support both its legacy tools/bin lookup and its newer bin lookup.
          mkdir -p "$ANDROID_HOME/bin" "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"

          # Write Bubblewrap's config directly. updateConfig calls loadOrCreateConfig()
          # before applying flags in some CLI versions, which triggers an interactive JDK prompt
          # on a clean GitHub Actions runner.
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

          echo "Android SDK root: $(realpath "$ANDROID_HOME")"
          ls -la "$ANDROID_HOME/bin" "$ANDROID_HOME/tools/bin"
          cat "$HOME/.bubblewrap/config.json"
          node -e 'const fs=require("node:fs");const path=require("node:path");const c=JSON.parse(fs.readFileSync(process.env.HOME+"/.bubblewrap/config.json","utf8"));if(!c.androidSdkPath||!fs.existsSync(c.androidSdkPath)||(!fs.existsSync(path.join(c.androidSdkPath,"tools"))&&!fs.existsSync(path.join(c.androidSdkPath,"bin"))))throw new Error("Bubblewrap SDK config points to an invalid SDK root: "+c.androidSdkPath);console.log("Validated Bubblewrap SDK path:",c.androidSdkPath)'
          bubblewrap doctor

      - name: Generate Android project
        working-directory: android
        run: CI=true bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Reassert Bubblewrap SDK configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/bin" "$ANDROID_HOME/tools/bin" "$HOME/.bubblewrap"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$(realpath "$ANDROID_HOME")" > "$HOME/.bubblewrap/config.json"
          node -e 'const fs=require("node:fs");const path=require("node:path");const c=JSON.parse(fs.readFileSync(process.env.HOME+"/.bubblewrap/config.json","utf8"));if(!fs.existsSync(path.join(c.androidSdkPath,"platform-tools","adb")))throw new Error("ADB missing under "+c.androidSdkPath);if(!fs.existsSync(path.join(c.androidSdkPath,"build-tools","36.1.0")))throw new Error("Android build-tools 36.1.0 missing under "+c.androidSdkPath);console.log("Bubblewrap SDK validated:",c.androidSdkPath)'

      - name: Build signed test APK and AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.store_pass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.signing.outputs.store_pass }}
        run: bubblewrap build --manifest=twa-manifest.json --signingKeyPath=android.keystore --signingKeyAlias=africalatency

      - name: Upload test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: africalatency-android-test-build-${{ github.run_number }}
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 7
