name: Site shell and responsive QA
on:
  pull_request:
    branches: [main, feat/scan-filmstrip-v2, integration/finish-all]
  push:
    branches: [fix/sitewide-header-and-pages, integration/finish-all]
permissions:
  contents: read
jobs:
  shell-and-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search repository for legacy privacy-policy.html links
        run: |
          if git grep -nE 'href="[^"]*privacy-policy\.html' -- '*.html' '*.js' '*.mjs'; then
            echo 'FAIL: legacy privacy-policy.html links remain.'
            exit 1
          else
            result=$?
            if [ "$result" -eq 1 ]; then
              echo 'PASS: no remaining privacy-policy.html links.'
            else
              exit "$result"
            fi
          fi
      - name: Run auth return-path tests
        run: npm run test:auth-next
      - name: Run report filmstrip and playback tests
        run: npm run test:report-filmstrip
      - name: Verify static shell is synchronized
        run: node scripts/sync-site-shell.mjs --check
      - name: Run repository internal-link integrity check
        run: node scripts/check-links.mjs
      - name: Install browser QA dependencies
        run: npm install --no-save playwright http-server lighthouse
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local marketing site
        run: |
          node scripts/preview-server.mjs > /tmp/site.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Capture screenshots and assert responsive quality
        run: node scripts/visual-qa.mjs
      - name: Run Lighthouse desktop audits
        run: |
          export CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$CHROME_PATH"
          mkdir -p artifacts/site-shell/lighthouse
          for pair in "home|/" "pricing|/pricing" "locations|/locations" "why-africa-latency|/why-africa-latency"; do
            name="${pair%%|*}"
            route="${pair#*|}"
            npx lighthouse "http://127.0.0.1:4173${route}" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path="artifacts/site-shell/lighthouse/${name}-desktop.json"
          done
          node scripts/lighthouse-summary.mjs
      - name: Upload screenshots and QA table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africalatency-site-shell-qa
          path: artifacts/site-shell/
          if-no-files-found: warn
          retention-days: 14
