name: Responsive navigation review

on:
  pull_request:
    branches: [main]
    paths:
      - 'pricing.html'
      - 'scan.html'
      - 'services.html'
      - 'tools.html'
      - 'docs.html'
      - 'monitoring.html'
      - 'js/main.js'
      - 'js/homepage-reference-redesign.js'
      - 'css/pricing.css'
      - 'css/homepage-reference-redesign.css'
      - 'scripts/nav-responsive-review.mjs'
      - '.github/workflows/nav-responsive-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prepare baseline from main
        run: |
          git fetch origin main
          git worktree add --detach /tmp/africalatency-baseline origin/main
      - name: Start baseline and branch previews
        run: |
          python3 -m http.server 4174 --directory /tmp/africalatency-baseline --bind 127.0.0.1 >/tmp/nav-baseline.log 2>&1 &
          echo $! > /tmp/nav-baseline.pid
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" --bind 127.0.0.1 >/tmp/nav-preview.log 2>&1 &
          echo $! > /tmp/nav-preview.pid
          for port in 4173 4174; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/nav-preview.log /tmp/nav-baseline.log
              exit 1
            fi
          done
      - name: Run real-browser responsive review and capture before/after screenshots
        run: node scripts/nav-responsive-review.mjs
        env:
          PREVIEW_BASE: http://127.0.0.1:4173
          BASELINE_BASE: http://127.0.0.1:4174
      - name: Upload before/after responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: africalatency-responsive-before-after
          path: artifacts/nav-responsive/*.png
          if-no-files-found: error
          retention-days: 14
