name: Crawler audit tests

on:
  pull_request:
    paths:
      - 'api/crawler-audit.js'
      - 'tests/crawler-audit.test.js'
      - 'package.json'
      - '.github/workflows/crawler-audit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/crawler-audit.js'
      - 'tests/crawler-audit.test.js'
      - 'package.json'
      - '.github/workflows/crawler-audit-tests.yml'
  workflow_dispatch:

jobs:
  crawler-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --test tests/crawler-audit.test.js
