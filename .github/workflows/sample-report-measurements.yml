name: Sample report measurements

on:
  workflow_dispatch:
    inputs:
      country:
        description: "One country per run. Repeat at different times of day to build the sample."
        required: true
        type: choice
        options:
          - KE
          - ZA
          - NG
          - GH
          - EG
          - UG
          - TZ
          - MA
          - SN
      probe_limit:
        description: "Maximum probes requested for this single country (max 5; one measurement per run)"
        required: true
        type: choice
        options:
          - "3"
          - "5"
        default: "3"

permissions:
  contents: write

concurrency:
  group: sample-report-measurements
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref_name == 'integration/finish-all'
    name: One-country Globalping HTTP measurement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Run one bounded measurement
        env:
          COUNTRY: ${{ inputs.country }}
          PROBE_LIMIT: ${{ inputs.probe_limit }}
        run: node scripts/sample-report-measurement.mjs

      - name: Normalize successful measurement for aggregation
        if: success()
        env:
          COUNTRY: ${{ inputs.country }}
        run: node scripts/normalize-regional-measurement.mjs

      - name: Rebuild regional sample JSON
        if: success()
        run: node scripts/build-regional-sample.mjs

      - name: Commit normalized sample and aggregate to this branch
        if: success()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/regional-sample.json data/regional-measurements/
          if git diff --cached --quiet; then echo 'No sample data changes to commit.'; else git commit -m 'Update verified regional sample data'; git push origin "HEAD:${BRANCH_NAME}"; fi

      - name: Upload raw measurement JSON, including failure records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globalping-${{ inputs.country }}-${{ github.run_id }}
          path: |
            measurement-output/
            data/regional-sample.json
            data/regional-measurements/
          if-no-files-found: error
          retention-days: 30
