name: Scan V2 worker tests
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'sql/scan-v2.sql'
      - '.github/workflows/scan-v2-tests.yml'
  push:
    branches: [feature/scan-v2]
    paths:
      - 'worker/**'
      - 'sql/scan-v2.sql'
      - '.github/workflows/scan-v2-tests.yml'
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package.json
      - run: npm install --ignore-scripts
      - run: npm test
