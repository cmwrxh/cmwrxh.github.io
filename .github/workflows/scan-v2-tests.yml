name: Scan V2 worker tests
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'sql/scan-v2.sql'
      - 'js/scan-v2.js'
      - 'reports.html'
      - 'js/report-dashboard.js'
      - 'scripts/scan-failure-states-test.mjs'
      - 'scripts/report-state-test.mjs'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/site-shell-qa.yml'
      - '.github/workflows/scan-v2-tests.yml'
concurrency:
  group: scan-v2-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package.json
      - run: npm install --ignore-scripts
      - run: npm test
