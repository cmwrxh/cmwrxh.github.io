name: Crawler health regression tests

on:
  pull_request:
    paths:
      - 'api/crawler-audit-health.js'
      - 'dashboard.html'
      - 'tests/crawler-audit-health.test.js'
      - 'package.json'
      - '.github/workflows/crawler-health-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/crawler-audit-health.js'
      - 'dashboard.html'
      - 'tests/crawler-audit-health.test.js'
      - 'package.json'
      - '.github/workflows/crawler-health-tests.yml'
  workflow_dispatch:

jobs:
  crawler-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:crawler-health
      - run: npm run test:crawler-audit
      - run: npm run test:rum-beta
