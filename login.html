<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — AfricaLatency.dev</title><meta name="description" content="Sign in to your AfricaLatency dashboard."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="login-page"><section class="login-card"><a class="login-logo" href="/">africalatency<span style="color:#6f7580">.dev</span></a><div class="label">Secure access</div><h1>Welcome back.</h1><p class="hero-subtitle" style="margin:0 0 28px">Sign in to your AfricaLatency dashboard.</p><form id="login-form"><div style="margin-bottom:17px"><label for="email">Email <span class="required">*</span></label><input class="form-input" id="email" type="email" autocomplete="email" required placeholder="you@company.com"></div><div><label for="password">Password <span class="required">*</span></label><div class="password-wrap"><input class="form-input" id="password" type="password" autocomplete="current-password" required placeholder="Your password" style="padding-right:70px"><button class="password-toggle" id="password-toggle" type="button">Show</button></div></div><div class="login-links"><a href="mailto:support@africalatency.dev?subject=Password%20reset">Forgot password?</a><a href="/contact">Create an account</a></div><button class="btn btn-primary" type="submit">Login →</button><div id="login-status" role="status" aria-live="polite" style="margin-top:14px;color:var(--text-muted);font-size:.78rem"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://uzihwtxffklisczqvurf.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const form=document.getElementById('login-form');const status=document.getElementById('login-status');const password=document.getElementById('password');document.getElementById('password-toggle').addEventListener('click',function(){const shown=password.type==='text';password.type=shown?'password':'text';this.textContent=shown?'Show':'Hide'});form.addEventListener('submit',async(e)=>{e.preventDefault();status.textContent='Signing in…';const email=document.getElementById('email').value.trim();const pwd=password.value;const{error}=await supabaseClient.auth.signInWithPassword({email,password:pwd});if(error){status.textContent=error.message;return}window.location.href='/dashboard'});</script></body></html>
