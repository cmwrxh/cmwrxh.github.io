<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — AfricaLatency.dev</title><meta name="description" content="Sign in to your AfricaLatency account."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png"></head><body><main class="login-page login-page-offset"><section class="login-card"><a class="login-logo" href="/">africalatency<span style="color:#6f7580">.dev</span></a><div class="label">Sign in</div><h1>Sign in to your account</h1><p class="hero-subtitle" style="margin:0 0 28px">Welcome back.</p><form id="login-form"><div class="login-field"><label for="email">Email <span class="required">*</span></label><input class="form-input" id="email" type="email" autocomplete="email" required placeholder="you@company.com"></div><div class="login-field"><label for="password">Password <span class="required">*</span></label><div class="password-wrap"><input class="form-input" id="password" type="password" autocomplete="current-password" required placeholder="Your password" style="padding-right:58px"><button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div><div class="login-links"><a href="mailto:support@africalatency.dev?subject=Password%20reset">Forgot your password?</a><span>New to AfricaLatency? <a href="/contact">Sign up</a></span></div><button class="btn btn-primary" type="submit">Sign in</button><div id="login-status" role="status" aria-live="polite" style="margin-top:14px;color:var(--text-muted);font-size:.78rem"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://uzihwtxffklisczqvurf.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const form=document.getElementById('login-form');const status=document.getElementById('login-status');const password=document.getElementById('password');const toggle=document.getElementById('password-toggle');toggle.addEventListener('click',function(){const shown=password.type==='text';password.type=shown?'password':'text';this.setAttribute('aria-label',shown?'Show password':'Hide password');this.setAttribute('title',shown?'Show password':'Hide password');this.innerHTML=shown?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.5 18.5 0 0 1-3.1 3.7"></path><path d="M6.1 6.9C3.3 8.7 2 12 2 12s3.5 6 10 6c1.3 0 2.5-.2 3.5-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>'});form.addEventListener('submit',async(e)=>{e.preventDefault();status.textContent='Signing in…';const email=document.getElementById('email').value.trim();const pwd=password.value;const{error}=await supabaseClient.auth.signInWithPassword({email,password:pwd});if(error){status.textContent=error.message;return}window.location.href='/dashboard'});</script></body></html>
