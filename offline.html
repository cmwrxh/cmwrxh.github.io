<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0E131A">
  <title>You're offline | AfricaLatency</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;background:#0e131a;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(480px,100%);padding:32px;border:1px solid #263342;border-radius:18px;background:#141b24}
    img{width:44px;height:44px}h1{font-size:1.7rem;margin:22px 0 10px}p{color:#a8b4c4;line-height:1.65}
    button,a{display:inline-flex;align-items:center;justify-content:center;margin:8px 8px 0 0;padding:11px 16px;border-radius:9px;font:inherit;font-weight:600;text-decoration:none}
    button{border:0;background:#e2e8f0;color:#0e131a;cursor:pointer}a{border:1px solid #344255;color:#e2e8f0}
  </style>
</head>
<body>
  <main>
    <img src="/images/web-app-manifest-192x192.png" alt="" width="44" height="44">
    <h1>You're offline</h1>
    <p>AfricaLatency needs an internet connection to run scans, load reports, and securely access your account. Reconnect and try again. Your private dashboard and scan data are not stored for offline use.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/">Home</a>
  </main>
</body>
</html>
