<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AfricaLatency regional network view</title>
  <desc id="desc">Stylized Africa map with network nodes and latency paths between Nairobi, Lagos, Cairo and Johannesburg, without fabricated measurements.</desc>
  <defs>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39ff9a" stop-opacity=".9"/><stop offset="1" stop-color="#6fe7b5" stop-opacity=".15"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#080b10"/><rect x="1" y="1" width="1198" height="718" rx="28" fill="url(#grid)" stroke="#fff" stroke-opacity=".1"/>
  <g transform="translate(205 42) scale(1.05)">
    <path d="M326 37l48 16 33 45 43 24 16 42-18 44 12 48-30 35-3 42-34 29-15 62-39 57-37 9-26-32-39-17-28-50-37-16-15-46 7-40-27-38 17-36 28-13 4-35 30-24 12-40 37-28 38 9z" fill="#111821" stroke="#64707f" stroke-opacity=".55" stroke-width="2"/>
    <path d="M301 79l-42 17-29 34-48 17-22 38 19 33 43 4 26 34 44 11 34 31 36 6 22 42 40 19 22 38 42 12 25-34-10-46 20-31-21-44-34-27-7-49-45-18-31-35-46-9z" fill="#0d141c" opacity=".65"/>
    <path d="M246 286c56-19 105-25 153-14 43 10 78 38 108 75" fill="none" stroke="url(#path)" stroke-width="3" stroke-linecap="round" opacity=".65"/>
    <path d="M249 286c34-54 91-93 156-109 62-15 95 9 95 78" fill="none" stroke="url(#path)" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <path d="M249 286c45 48 100 87 159 102 61 15 116 6 153-22" fill="none" stroke="url(#path)" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <path d="M405 177c8 45 11 91 4 132-7 37-3 71 12 104" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="5 8"/>
    <g filter="url(#glow)"><circle cx="405" cy="177" r="7" fill="#39ff9a"/><circle cx="249" cy="286" r="7" fill="#39ff9a"/><circle cx="405" cy="413" r="7" fill="#39ff9a"/><circle cx="500" cy="255" r="7" fill="#39ff9a"/></g>
    <g font-family="Inter,Arial,sans-serif" fill="#fff"><text x="421" y="171" font-size="15" font-weight="700">Cairo</text><text x="265" y="281" font-size="15" font-weight="700">Lagos</text><text x="421" y="409" font-size="15" font-weight="700">Nairobi</text><text x="516" y="250" font-size="15" font-weight="700">Johannesburg</text></g>
  </g>
  <g transform="translate(765 94)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#7f8997" font-size="12" letter-spacing="2.5">REGIONAL PERFORMANCE VIEW</text><text x="0" y="48" fill="#fff" font-size="31" font-weight="700">One continent.</text><text x="0" y="84" fill="#fff" font-size="31" font-weight="700">Many paths.</text>
    <text x="0" y="128" fill="#a7afba" font-size="15">Countries, ISPs, routes, cloud regions</text><text x="0" y="151" fill="#a7afba" font-size="15">and edge locations can produce very</text><text x="0" y="174" fill="#a7afba" font-size="15">different user experiences.</text>
    <g transform="translate(0 226)"><rect width="330" height="116" rx="16" fill="#0d131a" stroke="#fff" stroke-opacity=".1"/><circle cx="28" cy="31" r="6" fill="#39ff9a"/><text x="47" y="36" fill="#fff" font-size="14" font-weight="700">Topology paths</text><text x="47" y="61" fill="#7f8997" font-size="12">Regional nodes + network routes</text><line x1="24" y1="83" x2="306" y2="83" stroke="#fff" stroke-opacity=".08"/><circle cx="28" cy="101" r="4" fill="#39ff9a"/><text x="42" y="105" fill="#7f8997" font-size="11">Illustrative only — no regional averages</text></g>
  </g>
  <text x="62" y="674" fill="#697482" font-family="Inter,Arial,sans-serif" font-size="12">Illustrative network topology • node placement represents regions, not live measurements</text>
</svg>