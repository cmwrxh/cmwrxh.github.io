<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Create your free account | AfricaLatency</title><meta name="description" content="Create a free AfricaLatency account to unlock and save full performance reports."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/marketing.css"><link rel="stylesheet" href="/css/brand.css?v=6"><style>.auth-wrap{max-width:500px;margin:0 auto;padding:64px 20px 90px}.auth-card{padding:26px;border:1px solid #dbe4ee;border-radius:16px;background:var(--bg-elevated,#fff)}.auth-card label{display:block;margin:14px 0 6px;font-weight:600}.auth-card input{width:100%;padding:13px;border:1px solid #dbe4ee;border-radius:9px;font:inherit}.auth-card button{width:100%;margin-top:16px}.auth-status{margin-top:14px;color:var(--text-muted);font-size:.9rem;line-height:1.6}.auth-google{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff!important;color:#202124!important;border:1px solid #dadce0!important;font-weight:600}.auth-google:hover{background:#f8faff!important;border-color:#c6c6c6!important}.auth-divider{text-align:center;color:var(--text-muted);font-size:.85rem;margin:18px 0}</style></head><body><nav><div class="nav-inner"><a href="/" class="nav-brand brand-lockup"><img class="brand-wordmark" src="/images/africalatency-logo-light.svg" alt="AfricaLatency" width="180" height="28"></a><ul class="nav-links"><li><a href="/scan">Free scan</a></li><li><a href="/login">Log in</a></li></ul></div></nav><main class="auth-wrap"><div class="scan-eyebrow">Free account</div><h1 style="font-size:clamp(2rem,5vw,3rem)">Unlock your performance report</h1><p style="color:var(--text-muted);line-height:1.7">Create an account to view the full audit and save the report to your account.</p><section class="auth-card"><button id="google-signup" class="btn btn-secondary auth-google" type="button"><svg class="google-mark" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/><path fill="#FBBC05" d="M12.6 27.5a12 12 0 0 1 0-7.1v-5.3H5.8a20 20 0 0 0 0 17.7l6.8-5.3z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3c1.6-4.8 6.1-8.3 11.4-8.3z"/></svg><span>Continue with Google</span></button><div class="auth-divider">or use your email</div><form id="signup-form"><label for="signup-email">Email</label><input id="signup-email" type="email" autocomplete="email" required placeholder="you@company.com"><label for="signup-password">Password</label><input id="signup-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><button id="signup-submit" class="btn btn-primary" type="submit">Create a FREE account</button></form><div id="signup-status" class="auth-status" role="status" aria-live="polite"></div><p style="font-size:.88rem;margin-top:18px">Already have an account? <a id="login-link" href="/login">Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(() => {
const client=window.supabase.createClient('https://uzihwtxffklisczqvurf.supabase.co','sb_publishable_dGaR1jgofny7tGVWh0TK2w_haSVNyWv');
const params=new URLSearchParams(location.search);const next=params.get('next')||'/dashboard';const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard';
document.getElementById('login-link').href='/login?next='+encodeURIComponent(safeNext);
const status=document.getElementById('signup-status');const submit=document.getElementById('signup-submit');
document.getElementById('google-signup').addEventListener('click',async()=>{status.textContent='Opening Google sign-in…';const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+safeNext}});if(error)status.textContent=error.message;});

})();
</script></body></html>
